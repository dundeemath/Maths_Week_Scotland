<script src="js_apps_switch.js"></script>
<style>
  /* Hides every interactive app's own element immediately -- before the
     page has even finished parsing -- in every build (website page or
     booklet chapter). Each app's own div id always ends "-app" (circ-app,
     leaf-app, bee-app, fern-app, konig-app, phyllo-js-app, tree-app,
     gal-app, kep-app, new-app, ein-app), which stays the same no matter
     how Quarto wraps the surrounding figure for a given build format. */
  html[data-js-apps="off"] [id$="-app"] {
    display: none !important;
  }
  /* Belt-and-braces for browsers that support :has(): also hide the
     whole numbered figure (app + its "Figure N" caption) around each
     app, including the Travelling Salesman map (fig-tsp), so no empty
     caption is left behind on the page. */
  html[data-js-apps="off"] figure:has(
    [id^="fig-galileo-moons"], [id^="fig-kepler-orbits"],
    [id^="fig-newton-gravity"], [id^="fig-einstein-precession"],
    [id^="fig-circadian"], [id^="fig-leaf-growth"],
    [id^="fig-fibonacci-bees"], [id^="fig-fractal-fern"],
    [id^="fig-konigsberg"], [id^="fig-phyllotaxis"],
    [id^="fig-tsp"], [id^="fig-tree-height"]
  ) {
    display: none !important;
  }
</style>
<script>
  /* Fallback for browsers without :has() support: once the page body
     has loaded, hide the whole figure/caption around each app the same
     way, by walking up from the app element itself. */
  document.addEventListener("DOMContentLoaded", function () {
    if (window.SHOW_JS_APPS !== false) return;
    document.querySelectorAll('[id$="-app"], [id^="fig-tsp"]').forEach(function (el) {
      var figure = el.closest("figure") || el.closest('[id^="fig-"]') || el;
      figure.style.display = "none";
    });
  });
</script>
